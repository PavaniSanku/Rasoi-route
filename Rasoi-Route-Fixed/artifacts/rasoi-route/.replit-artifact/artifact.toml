kind = "web"
previewPath = "/"
title = "Rasoi Route"
description = "A polished Indian food ordering and billing app with a complete menu, cart, coupon flow, and server-calculated invoice."
version = "1.0.0"
id = "artifacts/rasoi-route"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20917

[services.development]
run = "pnpm --filter @workspace/rasoi-route run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rasoi-route", "run", "build" ]
serve = "static"
publicDir = "artifacts/rasoi-route/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20917"
BASE_PATH = "/"
